<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>競走馬の全力走行検証 | EQUINE v19</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf4e9;color:#183b30;font:15px -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header,main{max-width:990px;margin:auto;padding:14px}header h1{margin:4px 0;font-size:clamp(21px,4vw,31px)}
header p,.small{color:#4f7063;font-size:13px}a{color:#176a6c}
.panel{background:#fff;border:1px solid #cdded2;border-radius:14px;padding:12px}
#stage{width:100%;height:clamp(330px,60vw,610px);background:#c0dfee;border-radius:10px;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
button,select{background:#20685d;color:white;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;min-width:92px;cursor:pointer}
select{background:#ecf4f3;color:#1c5049;border:1px solid #b5d2c9}
.phase{position:relative;height:18px;border-radius:20px;background:#e6e4c8;overflow:hidden}
#marker{position:absolute;top:0;bottom:0;width:5px;background:#dd5040;left:0}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}
.foot{border:1px solid #dae5dc;border-radius:8px;padding:9px 4px;text-align:center;font-size:12px}
.foot b{display:block;font-size:14px}.foot.down{background:#e8f2c9;border-color:#9bb56b}.foot.up{background:#f2f3f5}
#phase-label{font-weight:800;margin:9px 0}
@media(max-width:480px){.legend{gap:3px}.foot{font-size:11px}.controls{gap:5px}.controls button,.controls select{padding:10px 8px;min-width:0;flex:1;font-size:12px}}
</style></head><body>
<header><a href="./?race=shuka-2026&motion=v19">← レース本編へ</a><h1>競走馬の全力走行・動作検証 v19</h1>
<p>本編と同じ馬モデル・同じアニメーションモジュールを使用。左右の脚が同時に動いていないか、1コマずつ確認できます。</p></header>
<main><div class="panel">
<div id="stage"></div>
<div class="controls">
<button id="play">⏸ 停止</button><button id="step">1コマ進める</button>
<select id="rate" aria-label="表示速度"><option value=".25">0.25倍</option><option value=".5" selected>0.5倍</option><option value="1">1倍</option></select>
<select id="lead" aria-label="手前"><option value="right">右手前</option><option value="left">左手前</option></select>
<select id="camera" aria-label="視点"><option value="side">真横</option><option value="three">斜め前</option><option value="front">真正面</option></select>
</div>
<label class="small">歩幅内の位置 <input id="scrub" type="range" min="0" max="1000" value="0" style="width:100%"></label><div class="phase"><div id="marker"></div></div>
<p id="phase-label">ロード中...</p><div class="legend" id="legend"></div>
<p class="small">実際の競走馬の高速走行映像と17 m/sの接地時間を参考に、CC0モデルの走行モーションを再構築。非先導後肢 → 先導後肢 → 非先導前肢 → 先導前肢 → 四肢を回収する浮遊期。実測モーションキャプチャではありません。<a href="./docs/sprint-v19.md">出典・制作方法</a></p>
<div id="error" style="color:#b23637" role="alert"></div>
</div></main>
<script type="module">
try{
 const T=await import('./vendor/three.module.js');
 const {createRaceHorse,preloadRaceHorse}=await import('./assets/horse-anime.js?v=sprint-v19');
 const {updateGallop}=await import('./assets/chibi-gallop.js?v=sprint-v19');
 const stage=document.getElementById('stage'),$=id=>document.getElementById(id);
 const scene=new T.Scene();scene.background=new T.Color(0xdde8e9);
 const camera=new T.PerspectiveCamera(37,1,.05,100);
 const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;stage.append(renderer.domElement);
 scene.add(new T.HemisphereLight(0xffffff,0x68795c,1.8));const sun=new T.DirectionalLight(0xfff6e4,2.1);sun.position.set(3,8,6);scene.add(sun);
 const turf=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshStandardMaterial({color:0x879f73,roughness:1}));turf.rotation.x=-Math.PI/2;turf.position.y=-.002;scene.add(turf);
 const grid=new T.GridHelper(30,60,0xc4d0b6,0xa1b58d);grid.position.y=.002;scene.add(grid);
 await preloadRaceHorse(T);const model=createRaceHorse(T,scene,{no:1,name:'ギャロップ検証'},'#326fc0','#ffffff');
 let playing=false,elapsed=0,last=0;model.gaitState={phase:0,lead:1,time:0,change:null};$('play').textContent='▶ 再生';
 const names=['左前','右前','左後','右後'];
 function setCamera(){const c=$('camera').value;camera.position.set(c==='side'?6.3:c==='front'?0:5.1,c==='front'?1.55:c==='side'?1.65:2.5,c==='side'?0:c==='front'?6.5:5.4);camera.lookAt(0,1.18,.15)}setCamera();$('camera').onchange=setCamera;
 function draw(){
  const w=stage.clientWidth,h=stage.clientHeight;if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  const a=model.gallopAudit,feet=model.renderedHoofs();$('marker').style.left=(a.phase*100)+'%';$('scrub').value=Math.round(a.phase*1000);
  const grounded=feet.filter(f=>f.y<.028);$('phase-label').textContent='1ストライド '+(a.phase*100).toFixed(0)+'%｜'+(grounded.length?'接地・蹴り出し':'空中浮遊・四肢回収');
  $('legend').innerHTML=feet.map((f,i)=>'<div class="foot '+(f.y<.028?'down':'up')+'"><b>'+names[i]+'</b>'+(f.y<.028?'● 接地':'○ 回収')+' '+Math.max(0,f.y*100).toFixed(0)+' cm</div>').join('');renderer.render(scene,camera);
 }
 function seek(phase){playing=false;$('play').textContent='▶ 再生';model.gaitState.phase=((phase%1)+1)%1;model.gaitState.lead=$('lead').value==='right'?1:0;model.gaitState.change=null;updateGallop(model,5,elapsed,1,.6,{lead:$('lead').value,speedMps:16,frameDt:0,playing:false});draw()}
 window.EQUINE_GAIT_LAB={version:'v19',seek,snapshot:()=>({phase:model.gallopAudit.phase,lead:model.gallopAudit.lead,rig:model.gallopRig,hoofs:model.renderedHoofs(),bones:model.boneLengths(),drawCalls:renderer.info.render.calls}),setView:v=>{$('camera').value=v;setCamera();draw()},setLead:l=>{$('lead').value=l;seek(model.gaitState.phase)}};
 $('lead').onchange=()=>seek(model.gaitState.phase);$('scrub').oninput=()=>seek(Number($('scrub').value)/1000);
 $('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'⏸ 停止':'▶ 再生'};$('step').onclick=()=>seek(model.gaitState.phase+1/24);
 function paint(now){requestAnimationFrame(paint);const dt=last?Math.min(.06,(now-last)/1000):0;last=now;elapsed+=dt;updateGallop(model,5,elapsed,1,.6,{lead:$('lead').value,speedMps:16,frameDt:dt*Number($('rate').value),playing});draw()}
 seek(0);requestAnimationFrame(paint);
}catch(e){document.getElementById('error').textContent='WebGLの起動に失敗しました: '+String(e.message||e);console.error(e)}
</script></body></html>
