name: Publish shared race simulators
on:
  push:
    paths:
      - 'swan-2026/**'
      - 'race-engine/**'
      - '.github/workflows/publish-swan.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-swan
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared engine (18-horse and 6-horse cases)
        run: |
          node race-engine/tests/smoke.mjs
          node race-engine/tests/kikka-2026.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site/swan-2026 _site/race-engine
          cp -a swan-2026/. _site/swan-2026/
          cp -a race-engine/. _site/race-engine/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./swan-2026/"><a href="./swan-2026/">スワンSシミュレーター</a>' > _site/index.html
          touch _site/.nojekyll
      - name: Vendor pinned Three.js for offline-safe same-origin 3D
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/race-three three@0.160.0
          mkdir -p _site/race-engine/vendor
          cp /tmp/race-three/node_modules/three/build/three.module.js _site/race-engine/vendor/three.module.js
          cp /tmp/race-three/node_modules/three/LICENSE _site/race-engine/vendor/THREE-LICENSE.txt
          test -s _site/race-engine/vendor/three.module.js
      - name: Browser verification - actual mobile 3D and finish
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/race-playwright playwright@1.56.1
          /tmp/race-playwright/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site > /tmp/race-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          PLAYWRIGHT_ENTRY=/tmp/race-playwright/node_modules/playwright/index.mjs node race-engine/tests/mobile-browser.mjs
          PLAYWRIGHT_ENTRY=/tmp/race-playwright/node_modules/playwright/index.mjs node race-engine/tests/kikka-browser.mjs
      - name: Save real-browser 16x screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shuka-cinematic-16x-mobile
          path: /tmp/race-mobile-shots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
