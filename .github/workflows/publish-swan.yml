name: Publish Swan Stakes simulator
on:
  push:
    paths:
      - 'swan-2026/**'
      - '.github/workflows/publish-swan.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-swan
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages if necessary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = "404" ]; then
            echo 'Enabling GitHub Pages with Actions source'
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" \
              -d '{"build_type":"workflow"}'
          elif [ "$status" != "200" ]; then
            cat /tmp/pages.json
            exit 1
          fi
      - name: Prepare static site
        run: |
          mkdir -p _site/swan-2026
          cp swan-2026/index.html _site/swan-2026/index.html
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./swan-2026/"><a href="./swan-2026/">スワンSシミュレーター</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
