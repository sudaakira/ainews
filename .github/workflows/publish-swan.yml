name: Publish shared race simulators
on:
  push:
    paths:
      - 'swan-2026/**'
      - 'race-engine/**'
      - '.github/workflows/publish-swan.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-swan
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared engine (18-horse and 6-horse cases)
        run: node race-engine/tests/smoke.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site/swan-2026 _site/race-engine
          cp -a swan-2026/. _site/swan-2026/
          cp -a race-engine/. _site/race-engine/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./swan-2026/"><a href="./swan-2026/">スワンSシミュレーター</a>' > _site/index.html
          touch _site/.nojekyll
      - name: Vendor pinned Three.js for offline-safe same-origin 3D
        run: |
          npm install --no-save --no-audit --no-fund --prefix /tmp/race-three three@0.160.0
          mkdir -p _site/race-engine/vendor
          cp /tmp/race-three/node_modules/three/build/three.module.js _site/race-engine/vendor/three.module.js
          cp /tmp/race-three/node_modules/three/LICENSE _site/race-engine/vendor/THREE-LICENSE.txt
          test -s _site/race-engine/vendor/three.module.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
